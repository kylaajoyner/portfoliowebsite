      <div class="wrangle-track">

      </div>
      <h1 class="rodeo-title">Creatively...It&rsquo;s pretty hard to wrangle me</h1>

      <ul class="rodeo-gallery__grid rodeo-gallery__grid--big">
          <li class="rodeo-gallery__item rodeo-gallery__item--feature"><img src="assets/images/rodeo/swing-ride.jpg" width="1400" height="1050" alt="Swing carousel riders blurred at night" loading="lazy" decoding="async"></li>
